name: Feature request
description: A format, option or idea
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      description: Comment with your approach and wait to be assigned before you start, see CONTRIBUTING.md.
      options:
        - label: I'd like to work on this myself
